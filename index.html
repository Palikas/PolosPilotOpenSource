<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrbitPilot - Ultimate Astro Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #00d2ff;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        /* Červený nočný režim */
        body.night-vision {
            --bg-color: #050000;
            --panel-bg: #150000;
            --accent-color: #ff0000;
            --text-color: #ff4444;
            --border-color: #550000;
        }

        body.night-vision input, 
        body.night-vision select, 
        body.night-vision button {
            background: #200000 !important;
            color: #ff4444 !important;
            border-color: #550000 !important;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .panel.full-width {
            grid-column: 1 / -1;
        }

        h2 {
            margin-top: 0;
            font-size: 1.05rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--accent-color);
        }

        button, select, input {
            background: #2a2a2a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-size: 1rem;
        }

        button.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        button:hover {
            border-color: var(--accent-color);
        }

        .btn-ble { background: #0056b3; }
        .btn-ble:hover { border-color: #00aaff; }
        
        .btn-disconnect { background: #331111; }
        .btn-disconnect:hover { border-color: #ff4444; }

        /* Digitálny D-Pad */
        .joystick-pad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            max-width: 200px;
            margin: 10px auto;
        }

        .dpad-btn {
            touch-action: none;
            user-select: none;
        }

        /* Analógový Joystick */
        .analog-joystick-container {
            width: 150px;
            height: 150px;
            background: #111;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            margin: 15px auto;
            position: relative;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .analog-joystick-knob {
            width: 60px;
            height: 60px;
            background: var(--accent-color);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.05s linear;
        }

        /* Modal okno pre nastavenia */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .config-grid {
                grid-template-columns: 1fr;
            }
        }

        .config-section {
            background: #181818;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .camera-box {
            background: #000;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            color: #777;
            border: 1px dashed var(--border-color);
            font-style: italic;
            margin-bottom: 10px;
        }

        .focuser-group {
            display: flex;
            gap: 10px;
        }

        .dev-console {
            background: #000;
            color: var(--accent-color);
            font-family: monospace;
            padding: 10px;
            height: 110px;
            overflow-y: auto;
            border-radius: 5px;
            font-size: 0.85rem;
            border: 1px solid var(--accent-color);
            margin-top: 10px;
        }

        .status-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            margin-right: 5px;
        }
        .status-badge.connected {
            background: #44ff44;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body id="appBody">

    <header>
        <div>
            <span id="statusBadge" class="status-badge"></span>
            <strong id="statusText">Odpojené</strong>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button onclick="openSettingsModal()" style="padding: 6px 12px; margin: 0; width: auto; font-size: 0.85rem;">⚙️ Nastavenia</button>
            <label class="toggle-switch">
                <input type="checkbox" id="nightModeToggle" onchange="toggleNightVision()"> 🔴 Filter
            </label>
        </div>
    </header>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h2>Konfiguračné Menu (Settings)</h2>
            
            <div style="margin-bottom: 15px;">
                <label class="toggle-switch">
                    <input type="checkbox" id="devModeToggle" onchange="toggleDevMode()"> Zapnúť Dev Mode (Logy)
                </label>
            </div>

            <div class="config-grid">
                <div class="config-section">
                    <h3 style="color: var(--accent-color); font-size: 0.95rem; margin-top:0;">Os AZ (Azimut)</h3>
                    <label style="font-size: 0.8rem; color: #aaa;">Driver:</label>
                    <select id="cfgDriverAZ">
                        <option value="TMC2209">TMC2209</option>
                        <option value="A4988">A4988</option>
                        <option value="DRV8825">DRV8825</option>
                    </select>

                    <label style="font-size: 0.8rem; color: #aaa; margin-top: 8px; display: block;">Mikrokrokovanie:</label>
                    <select id="cfgMicrostepAZ">
                        <option value="1">1 (Plný)</option>
                        <option value="16" selected>1/16</option>
                        <option value="32">1/32</option>
                    </select>

                    <label style="font-size: 0.8rem; color: #aaa; margin-top: 8px; display: block;">Redukčný prevod:</label>
                    <input type="number" id="cfgReductionAZ" value="10.0" step="0.1">

                    <label style="font-size: 0.8rem; color: #aaa; margin-top: 8px; display: block;">Backlash (kroky):</label>
                    <input type="number" id="cfgBacklashAZ" value="15" min="0">
                </div>

                <div class="config-section">
                    <h3 style="color: var(--accent-color); font-size: 0.95rem; margin-top:0;">Os ALT (Výška)</h3>
                    <label style="font-size: 0.8rem; color: #aaa;">Driver:</label>
                    <select id="cfgDriverALT">
                        <option value="TMC2209">TMC2209</option>
                        <option value="A4988">A4988</option>
                        <option value="DRV8825">DRV8825</option>
                    </select>

                    <label style="font-size: 0.8rem; color: #aaa; margin-top: 8px; display: block;">Mikrokrokovanie:</label>
                    <select id="cfgMicrostepALT">
                        <option value="1">1 (Plný)</option>
                        <option value="16" selected>1/16</option>
                        <option value="32">1/32</option>
                    </select>

                    <label style="font-size: 0.8rem; color: #aaa; margin-top: 8px; display: block;">Redukčný prevod:</label>
                    <input type="number" id="cfgReductionALT" value="10.0" step="0.1">

                    <label style="font-size: 0.8rem; color: #aaa; margin-top: 8px; display: block;">Backlash (kroky):</label>
                    <input type="number" id="cfgBacklashALT" value="15" min="0">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="closeSettingsModal()" style="background: #224422;">Uložiť a zavrieť</button>
            </div>
        </div>
    </div>

    <div class="container">
        
        <div class="panel">
            <h2>Pripojenie</h2>
            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                <button onclick="connectWS()" style="flex: 1;">📡 Pripojiť Wi-Fi</button>
                <button class="btn-ble" onclick="connectBLE()" style="flex: 1;">🔵 Pripojiť Bluetooth</button>
            </div>
            <button class="btn-disconnect" onclick="disconnectAll()">Odpojiť Všetko</button>
        </div>

        <div class="panel">
            <h2>Telescope Alignment</h2>
            <div style="display: flex; gap: 5px; margin-bottom: 8px;">
                <button id="btnAlign1" class="active" onclick="setAlignMode('1-star')">1-Star</button>
                <button id="btnAlign2" onclick="setAlignMode('2-star')">2-Star</button>
            </div>
            
            <div id="alignStar1Box">
                <label style="font-size: 0.8rem; color: #aaa;">Referenčná hviezda 1:</label>
                <select id="alignStarSelect1">
                    <option value="Sirius">Sirius</option>
                    <option value="Vega">Vega</option>
                    <option value="Arcturus">Arcturus</option>
                </select>
            </div>

            <div id="alignStar2Box" style="display: none; margin-top: 5px;">
                <label style="font-size: 0.8rem; color: #aaa;">Referenčná hviezda 2:</label>
                <select id="alignStarSelect2">
                    <option value="Rigel">Rigel</option>
                    <option value="Betelgeuse">Betelgeuse</option>
                    <option value="Polaris">Polaris</option>
                </select>
            </div>

            <button onclick="startAlignmentRoutine()">1. Homing & Spustiť Alignment</button>
        </div>

        <div class="panel">
            <h2>Ovládanie & Joystick</h2>
            
            <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                <button id="btnDigMode" class="active" onclick="setJoystickMode('digital')">Digitálny</button>
                <button id="btnAnaMode" onclick="setJoystickMode('analog')">Analogový</button>
            </div>

            <div id="digitalJoystick" class="joystick-pad">
                <div></div>
                <button class="dpad-btn" data-dir="UP">⬆</button>
                <div></div>
                <button class="dpad-btn" data-dir="LEFT">⬅</button>
                <button class="dpad-btn" data-dir="STOP">⏹</button>
                <button class="dpad-btn" data-dir="RIGHT">➡</button>
                <div></div>
                <button class="dpad-btn" data-dir="DOWN">⬇</button>
                <div></div>
            </div>

            <div id="analogJoystick" style="display: none; text-align: center;">
                <div class="analog-joystick-container" id="joystickPad">
                    <div class="analog-joystick-knob" id="joystickKnob"></div>
                </div>
            </div>

            <div style="margin-top: 10px; font-size: 0.8rem; background: #111; padding: 6px; border-radius: 4px;">
                📍 Smerovanie (Telemetria): <span id="telemetryPos" style="color: var(--accent-color);">Az: 0.0°, Alt: 0.0°</span>
            </div>
        </div>

        <div class="panel">
            <h2>GoTo Obloha (Web Calc)</h2>
            <select id="skyObjectsSelect">
                <option value="">Načítavam oblohu z GPS...</option>
            </select>
            <button onclick="calculateAndSendGoto()">Prepočítať a ísť na GoTo</button>
        </div>

        <div class="panel full-width">
            <h2>Hardware, Kamera & Periférie</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <button id="fanBtn" onclick="toggleFan()">Ventilátor: VYPNUTÝ</button>
                    <button id="chargeBtn" onclick="toggleCharge()">Nabíjanie telefónu: VYPNUTÉ</button>
                </div>
                <div>
                    <div class="camera-box" id="cameraBox">No camera feed</div>
                    <div class="focuser-group">
                        <button onclick="sendCmd('FOCUS:DEC')">➖ Ostrenie</button>
                        <button onclick="sendCmd('FOCUS:INC')">➕ Ostrenie</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel full-width" id="devConsoleContainer" style="display: none;">
            <h2>[Dev Console & Logs]</h2>
            <div class="dev-console" id="devConsolePanel">
                <div id="logContent">Systém pripravený...</div>
            </div>
        </div>

    </div>

    <script>
        // --- Wi-Fi premenné ---
        let ws = null;
        
        // --- BLE premenné ---
        let bluetoothDevice = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let bleReceiveBuffer = "";
        
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // Pre zápis (Arduino prijíma)
        const UART_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // Pre čítanie (Arduino posiela)

        // --- Stavové premenné ---
        let userLat = 48.669, userLon = 19.699;
        let currentAlignMode = '1-star';
        let telescopePos = { az: 0, alt: 0 };
        let lastDirAz = 0;   // -1, 0, alebo 1 - smer posledného GoTo pohybu (pre backlash)
        let lastDirAlt = 0;
        let fanState = false;
        let chargeState = false;

        function openSettingsModal() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }

        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude; userLon = pos.coords.longitude;
                    initSkyObjects();
                }, () => initSkyObjects());
            } else { initSkyObjects(); }
            initAnalogJoystick();
            initDigitalDpad();
        };

        function log(message) {
            const consoleDiv = document.getElementById('logContent');
            if(!consoleDiv) return;
            const time = new Date().toLocaleTimeString();
            consoleDiv.innerHTML += `<br>[${time}] ${message}`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function toggleNightVision() {
            document.getElementById('appBody').classList.toggle('night-vision', document.getElementById('nightModeToggle').checked);
        }

        function toggleDevMode() {
            document.getElementById('devConsoleContainer').style.display = document.getElementById('devModeToggle').checked ? 'block' : 'none';
        }

        function setAlignMode(mode) {
            currentAlignMode = mode;
            document.getElementById('btnAlign1').classList.toggle('active', mode === '1-star');
            document.getElementById('btnAlign2').classList.toggle('active', mode === '2-star');
            document.getElementById('alignStarSelect2').style.display = (mode === '2-star') ? 'block' : 'none';
        }

        function startAlignmentRoutine() {
            sendCmd("ALIGN:START:" + currentAlignMode);
            log("Spustená kalibračná rutina (Homing)...");
        }

        function initSkyObjects() {
            const select = document.getElementById('skyObjectsSelect');
            select.innerHTML = '<option value="">-- Vyber objekt --</option>';
            const now = new Date();
            const observer = new Astronomy.Observer(userLat, userLon, 0);
            ["Moon", "Jupiter", "Saturn", "Mars"].forEach(target => {
                try {
                    const eq = Astronomy.Equator(target, now, observer, true, true);
                    const hor = Astronomy.Horizon(now, observer, eq.ra, eq.dec, "apparent");
                    if (hor.altitude > 0) {
                        let opt = document.createElement('option');
                        opt.value = JSON.stringify({ name: target, az: hor.azimuth, alt: hor.altitude });
                        opt.textContent = `${target} | Az: ${hor.azimuth.toFixed(1)}° Alt: ${hor.altitude.toFixed(1)}°`;
                        select.appendChild(opt);
                    }
                } catch(e) {}
            });
        }

        // Najkratšia uhlová vzdialenosť z current do target, v rozsahu (-180, 180].
        // Bez tohto by napr. 350° -> 10° vyšlo -340° namiesto správnych +20°.
        function shortestAngleDelta(target, current) {
            return ((target - current + 180) % 360 + 360) % 360 - 180;
        }

        function calculateAndSendGoto() {
            const select = document.getElementById('skyObjectsSelect');
            if(!select.value) return;
            const target = JSON.parse(select.value);
            
            const microstepAZ = parseInt(document.getElementById('cfgMicrostepAZ').value);
            const reductionAZ = parseFloat(document.getElementById('cfgReductionAZ').value);
            const microstepALT = parseInt(document.getElementById('cfgMicrostepALT').value);
            const reductionALT = parseFloat(document.getElementById('cfgReductionALT').value);
            const backlashAZ = parseInt(document.getElementById('cfgBacklashAZ').value) || 0;
            const backlashALT = parseInt(document.getElementById('cfgBacklashALT').value) || 0;

            const deltaAz = shortestAngleDelta(target.az, telescopePos.az);
            const deltaAlt = target.alt - telescopePos.alt; // ALT nie je cyklická (nepresahuje 0/360), tu wraparound netreba

            let stepsAz = Math.round(deltaAz * ((200 * microstepAZ * reductionAZ) / 360.0));
            let stepsAlt = Math.round(deltaAlt * ((200 * microstepALT * reductionALT) / 360.0));

            // Backlash: ak sa smer otáčania oproti poslednému GoTo pohybu obrátil,
            // pridaj kroky navyše na dobehnutie vôle v prevode pred samotným pohybom.
            const dirAz = Math.sign(stepsAz);
            const dirAlt = Math.sign(stepsAlt);
            if (dirAz !== 0 && lastDirAz !== 0 && dirAz !== lastDirAz) {
                stepsAz += dirAz * backlashAZ;
            }
            if (dirAlt !== 0 && lastDirAlt !== 0 && dirAlt !== lastDirAlt) {
                stepsAlt += dirAlt * backlashALT;
            }
            if (dirAz !== 0) lastDirAz = dirAz;
            if (dirAlt !== 0) lastDirAlt = dirAlt;

            telescopePos.az = target.az;
            telescopePos.alt = target.alt;
            let cmd = `STEPS:AZ:${stepsAz}:ALT:${stepsAlt}`;
            log("[WEB CALC] " + cmd);
            sendCmd(cmd);
        }

        function setJoystickMode(mode) {
            document.getElementById('btnDigMode').classList.toggle('active', mode === 'digital');
            document.getElementById('btnAnaMode').classList.toggle('active', mode === 'analog');
            document.getElementById('digitalJoystick').style.display = mode === 'digital' ? 'grid' : 'none';
            document.getElementById('analogJoystick').style.display = mode === 'analog' ? 'block' : 'none';
        }

        // Digitálny D-pad cez Pointer Events (zjednocuje myš/dotyk/pero do 1 udalosti,
        // takže sa príkaz neposiela 2x a pri pustení tlačidla ide MOVE:STOP)
        function initDigitalDpad() {
            const buttons = document.querySelectorAll('#digitalJoystick .dpad-btn');
            buttons.forEach(btn => {
                const dir = btn.dataset.dir;

                const start = (e) => {
                    e.preventDefault();
                    sendCmd(dir === 'STOP' ? 'MOVE:STOP' : `MOVE:${dir}`);
                };
                const stop = (e) => {
                    e.preventDefault();
                    if (dir !== 'STOP') sendCmd('MOVE:STOP');
                };

                btn.addEventListener('pointerdown', start);
                btn.addEventListener('pointerup', stop);
                btn.addEventListener('pointercancel', stop);
                btn.addEventListener('pointerleave', stop);
            });
        }

        function initAnalogJoystick() {
            const pad = document.getElementById('joystickPad');
            const knob = document.getElementById('joystickKnob');
            let isDragging = false;
            let center = { x: 0, y: 0 };
            const maxRadius = 45;
            
            // Premenné na ukladanie aktuálnych súradníc a časovača
            let currentNormX = 0;
            let currentNormY = 0;
            let sendInterval = null;

            function handleStart(e) {
                isDragging = true;
                const rect = pad.getBoundingClientRect();
                center = { x: rect.width / 2, y: rect.height / 2 };
                handleMove(e);

                // Spustíme pravidelné odosielanie dát každých 50 ms, kým držíš joystick
                if (!sendInterval) {
                    sendInterval = setInterval(() => {
                        if (isDragging) {
                            sendCmd(`ANALOG:${currentNormX}:${currentNormY}`);
                        }
                    }, 50); 
                }
            }

            function handleMove(e) {
                if (!isDragging) return;
                const rect = pad.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                let x = clientX - rect.left - center.x;
                let y = clientY - rect.top - center.y;

                const distance = Math.sqrt(x * x + y * y);
                if (distance > maxRadius) {
                    x = (x / distance) * maxRadius;
                    y = (y / distance) * maxRadius;
                }

                knob.style.transform = `translate(${x}px, ${y}px)`;
                
                // Uložíme aktuálne hodnoty do premenných (odsielat ich bude interval)
                currentNormX = Math.round((x / maxRadius) * 100);
                currentNormY = Math.round((-y / maxRadius) * 100);
            }

            function handleEnd() {
                if (!isDragging) return;
                isDragging = false;
                
                // Zastavíme pravidelné odosielanie
                if (sendInterval) {
                    clearInterval(sendInterval);
                    sendInterval = null;
                }

                knob.style.transform = `translate(0px, 0px)`;
                currentNormX = 0;
                currentNormY = 0;
                
                // Odošleme finálne zastavenie
                sendCmd(`ANALOG:0:0`);
            }

            pad.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
            pad.addEventListener('touchstart', handleStart);
            window.addEventListener('touchmove', handleMove);
            window.addEventListener('touchend', handleEnd);
        }

        // ==========================================
        // --- LOGIKA PRIPOJENIA (Wi-Fi & BLE) ---
        // ==========================================

        // Pripojenie Wi-Fi
        function connectWS() {
            let wsHadError = false;
            updateStatusUI("Pripájam Wi-Fi...", false);
            ws = new WebSocket('ws://192.168.4.1:81');
            ws.onopen = () => {
                updateStatusUI("Wi-Fi Pripojené", true);
                log("Pripojené k Wi-Fi Bridge.");
            };
            ws.onerror = () => {
                wsHadError = true;
                if (window.location.protocol === 'https:') {
                    log("CHYBA Wi-Fi: stránka beží cez HTTPS a prehliadač blokuje nezabezpečené ws:// spojenie (Mixed Content). Otvor stránku ako lokálny súbor alebo cez HTTP.");
                } else {
                    log("CHYBA Wi-Fi spojenia. Skontroluj, či si pripojený na sieť z ESP32 a či sedí adresa 192.168.4.1:81.");
                }
            };
            ws.onclose = () => {
                ws = null;
                if (wsHadError && window.location.protocol === 'https:') {
                    updateStatusUI("Wi-Fi: Mixed Content blok (pozri log)", false);
                } else {
                    checkConnectionStatus();
                }
                log("Wi-Fi odpojené.");
            };
            ws.onmessage = (event) => { parseTelemetry(event.data); };
        }

        // Pripojenie BLE
        async function connectBLE() {
            if (!navigator.bluetooth) {
                alert('Tvoj prehliadač nepodporuje Web Bluetooth!');
                return;
            }
            try {
                updateStatusUI("Hľadám Bluetooth...", false);
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [UART_SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onBleDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                
                rxCharacteristic = await service.getCharacteristic(UART_RX_UUID);
                txCharacteristic = await service.getCharacteristic(UART_TX_UUID);
                
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleBleNotifications);

                updateStatusUI("Bluetooth Pripojené", true);
                log("Pripojené k Bluetooth: " + bluetoothDevice.name);

            } catch (error) {
                console.error(error);
                checkConnectionStatus();
                log("Pripojenie Bluetooth zlyhalo.");
            }
        }

        // Spracovanie prichádzajúcich dát z BLE
        function handleBleNotifications(event) {
            const decoder = new TextDecoder('utf-8');
            bleReceiveBuffer += decoder.decode(event.target.value);
            
            let lines = bleReceiveBuffer.split('\n');
            for (let i = 0; i < lines.length - 1; i++) {
                parseTelemetry(lines[i].trim());
            }
            bleReceiveBuffer = lines[lines.length - 1];
        }

        // Odpojenie BLE
        function onBleDisconnected() {
            rxCharacteristic = null;
            txCharacteristic = null;
            bluetoothDevice = null;
            checkConnectionStatus();
            log("Bluetooth odpojené.");
        }

        // Hromadné odpojenie
        function disconnectAll() { 
            if(ws) ws.close(); 
            if(bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            updateStatusUI("Odpojené", false);
        }

        // Kontrola, čo je aktuálne pripojené
        function checkConnectionStatus() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                updateStatusUI("Wi-Fi Pripojené", true);
            } else if (rxCharacteristic) {
                updateStatusUI("Bluetooth Pripojené", true);
            } else {
                updateStatusUI("Odpojené", false);
            }
        }

        // UI update hlavičky
        function updateStatusUI(text, isConnected) {
            document.getElementById('statusText').innerText = text;
            if (isConnected) {
                document.getElementById('statusBadge').classList.add('connected');
            } else {
                document.getElementById('statusBadge').classList.remove('connected');
            }
        }

        // ==========================================
        // --- SPRACOVANIE A ODOSIELANIE DÁT ---
        // ==========================================

        function parseTelemetry(data) {
            if (!data) return;
            log("Prijaté: " + data);
            
            if(data.startsWith("POS:")) {
                let parts = data.split(":");
                if(parts.length >= 5) {
                    telescopePos.az = parseFloat(parts[2]);
                    telescopePos.alt = parseFloat(parts[4]);
                    document.getElementById('telemetryPos').innerText = `Az: ${telescopePos.az.toFixed(1)}°, Alt: ${telescopePos.alt.toFixed(1)}°`;
                }
            } else if(data === "ALIGN:POINT_CONFIRMED") {
                alert("Bod zarovnania potvrdený stlačením joysticku na teleskope!");
            }
        }

        // Zjednotená funkcia na odosielanie (Preferuje Wi-Fi, inak BLE)
        async function sendCmd(cmd) {
            let sent = false;

            // 1. Skús Wi-Fi (WebSocket)
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd + "\n");
                sent = true;
            } 
            // 2. Skús Bluetooth (BLE)
            else if (rxCharacteristic) {
                try {
                    const encoder = new TextEncoder();
                    await rxCharacteristic.writeValue(encoder.encode(cmd + "\n"));
                    sent = true;
                } catch (error) {
                    console.error("BLE Send Error:", error);
                }
            }

            if (sent) {
                log("Odoslané: " + cmd);
            } else {
                log("CHYBA: Príkaz nebol odoslaný. Skontroluj pripojenie.");
            }
        }

        // --- Tlačidlá Periférií ---
        function toggleFan() {
            fanState = !fanState;
            const btn = document.getElementById('fanBtn');
            btn.innerText = fanState ? "Ventilátor: ZAPNUTÝ" : "Ventilátor: VYPNUTÝ";
            btn.classList.toggle('active', fanState);
            sendCmd(fanState ? "CMD:FAN:1" : "CMD:FAN:0"); // Upravené pre zhodu s tvojím Arduinom
        }

        function toggleCharge() {
            chargeState = !chargeState;
            const btn = document.getElementById('chargeBtn');
            btn.innerText = chargeState ? "Nabíjanie telefónu: ZAPNUTÉ" : "Nabíjanie telefónu: VYPNUTÉ";
            btn.classList.toggle('active', chargeState);
            sendCmd(chargeState ? "CMD:CHARGE:1" : "CMD:CHARGE:0");
        }
    </script>
